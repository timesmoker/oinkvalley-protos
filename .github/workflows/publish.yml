# Domain tag → one language stub package
#
#   git tag board-v1/1.0.0 && git push origin board-v1/1.0.0
#
# Java:  com.oinkvalley.protos:board-v1:1.0.0
# Python: Release asset
#
# Note: tag names contain `/`. GitHub `*` does not match `/`, so use `**`
# and gate with job `if` (plain tags like 0.0.1 are skipped).
name: publish

on:
  push:
    tags:
      - "**"

permissions:
  contents: write
  packages: write

jobs:
  parse:
    # board-v1/1.0.0 OK · 0.0.1 skip
    if: contains(github.ref_name, '-v') && contains(github.ref_name, '/')
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.p.outputs.artifact }}
      version: ${{ steps.p.outputs.version }}
      gradle_project: ${{ steps.p.outputs.gradle_project }}
      idl_dir: ${{ steps.p.outputs.idl_dir }}
    steps:
      - id: p
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARTIFACT="${TAG%%/*}"
          VERSION="${TAG#*/}"
          # board-v1 → board ; bubble-pal-api-v1 → bubble_pal_api
          BASE="${ARTIFACT%-v1}"
          IDL_DIR="${BASE//-/_}"
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "gradle_project=${IDL_DIR}" >> "$GITHUB_OUTPUT"
          echo "idl_dir=${IDL_DIR}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG} artifact=${ARTIFACT} version=${VERSION} project=${IDL_DIR}"

  java:
    needs: parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Publish Java module
        working-directory: java
        env:
          VERSION: ${{ needs.parse.outputs.version }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon ":${{ needs.parse.outputs.gradle_project }}:publish"

  python:
    needs: parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate + build wheel
        env:
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          python -m pip install -U pip build "grpcio-tools>=1.68"
          chmod +x python/generate.sh
          ./python/generate.sh "${{ needs.parse.outputs.idl_dir }}"
          python -m build python

      - name: Attach wheel to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: python/dist/*
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
