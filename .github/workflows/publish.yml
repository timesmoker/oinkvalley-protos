# Git tag → language stub packages
#
#   git tag 0.0.1 && git push origin 0.0.1
#
# Java  → GitHub Packages (Maven): com.oinkvalley:oinkvalley-protos:TAG
# Python → GitHub Release assets (wheel/sdist) — GH Packages에 PyPI 레지스트리 없음
name: publish

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  packages: write

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Publish Java stubs
        working-directory: java
        env:
          VERSION: ${{ github.ref_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon publish

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate + build wheel
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python -m pip install -U pip build "grpcio-tools>=1.68"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" python/pyproject.toml
          chmod +x python/generate.sh
          ./python/generate.sh
          python -m build python

      - name: Attach wheel to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: python/dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
