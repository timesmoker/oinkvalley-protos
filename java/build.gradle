plugins {
	id 'com.google.protobuf' version '0.9.6' apply false
}

// 도메인별 서브프로젝트 공통 설정.
// artifact: com.oinkvalley.protos:<name-with-hyphens>-v1:<version>
// 예: board → board-v1, bubble_pal_api → bubble-pal-api-v1

subprojects {
	apply plugin: 'java-library'
	apply plugin: 'maven-publish'
	apply plugin: 'com.google.protobuf'

	group = 'com.oinkvalley.protos'
	version = System.getenv('VERSION') ?: '0.0.0-SNAPSHOT'

	def mavenArtifactId = "${project.name.replace('_', '-')}-v1"
	def idlRoot = rootProject.projectDir.parentFile
	def idlDir = project.name

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
		withSourcesJar()
	}

	repositories {
		mavenCentral()
	}

	tasks.register('syncIdl', Sync) {
		from("${idlRoot}/${idlDir}") {
			include '**/*.proto'
		}
		into layout.projectDirectory.dir("src/main/proto/${idlDir}")
	}

	tasks.named('extractProto').configure { dependsOn('syncIdl') }
	tasks.named('generateProto').configure { dependsOn('syncIdl') }

	protobuf {
		protoc {
			artifact = 'com.google.protobuf:protoc:4.29.3'
		}
		plugins {
			grpc {
				artifact = 'io.grpc:protoc-gen-grpc-java:1.69.1'
			}
		}
		generateProtoTasks {
			all().configureEach {
				plugins {
					grpc {}
				}
			}
		}
	}

	dependencies {
		api 'com.google.protobuf:protobuf-java:4.29.3'
		api 'io.grpc:grpc-api:1.69.1'
		api 'io.grpc:grpc-stub:1.69.1'
		api 'io.grpc:grpc-protobuf:1.69.1'
		compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
	}

	publishing {
		publications {
			maven(MavenPublication) {
				from components.java
				artifactId = mavenArtifactId
			}
		}
		repositories {
			maven {
				name = 'GitHubPackages'
				url = uri('https://maven.pkg.github.com/timesmoker/oinkvalley-protos')
				credentials {
					username = System.getenv('GITHUB_ACTOR') ?: ''
					password = System.getenv('GITHUB_TOKEN') ?: ''
				}
			}
		}
	}
}
