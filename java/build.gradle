plugins {
	id 'java-library'
	id 'maven-publish'
	id 'com.google.protobuf' version '0.9.6'
}

group = 'com.oinkvalley'
version = System.getenv('VERSION') ?: '0.0.0-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	withSourcesJar()
}

repositories {
	mavenCentral()
}

def idlRoot = rootProject.projectDir.parentFile

sourceSets {
	main {
		proto {
			srcDir idlRoot
			include 'board/**/*.proto'
			include 'profile/**/*.proto'
			include 'bubble_pal_api/**/*.proto'
			include 'bubble_pal_engine/**/*.proto'
			include 'content_fetcher/**/*.proto'
		}
	}
}

protobuf {
	protoc {
		artifact = 'com.google.protobuf:protoc:4.29.3'
	}
	plugins {
		grpc {
			artifact = 'io.grpc:protoc-gen-grpc-java:1.69.1'
		}
	}
	generateProtoTasks {
		all().configureEach {
			plugins {
				grpc {}
			}
		}
	}
}

dependencies {
	api 'com.google.protobuf:protobuf-java:4.29.3'
	api 'io.grpc:grpc-api:1.69.1'
	api 'io.grpc:grpc-stub:1.69.1'
	api 'io.grpc:grpc-protobuf:1.69.1'
	compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
}

publishing {
	publications {
		maven(MavenPublication) {
			from components.java
			artifactId = 'oinkvalley-protos'
		}
	}
	repositories {
		maven {
			name = 'GitHubPackages'
			url = uri('https://maven.pkg.github.com/timesmoker/oinkvalley-protos')
			credentials {
				username = System.getenv('GITHUB_ACTOR') ?: ''
				password = System.getenv('GITHUB_TOKEN') ?: ''
			}
		}
	}
}
