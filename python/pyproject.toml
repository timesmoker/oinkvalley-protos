[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "oinkvalley-protos-content-fetcher-v1"
version = "1.0.1"
description = "Generated gRPC stubs: content_fetcher"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.68",
  "protobuf>=5.29",
]

[tool.hatch.build]
# generated tree is gitignored; without this the wheel ships empty metadata only
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["oinkvalley_content_fetcher"]

[tool.hatch.build.targets.sdist]
include = ["oinkvalley_content_fetcher", "README.md"]
