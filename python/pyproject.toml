[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "oinkvalley-protos"
version = "0.0.0"
description = "Generated gRPC stubs for oinkvalley internal APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.68",
  "protobuf>=5.29",
]

[tool.hatch.build.targets.wheel]
packages = [
  "board",
  "profile",
  "bubble_pal_api",
  "bubble_pal_engine",
  "content_fetcher",
]

[tool.hatch.build.targets.sdist]
include = [
  "board",
  "profile",
  "bubble_pal_api",
  "bubble_pal_engine",
  "content_fetcher",
  "README.md",
]
